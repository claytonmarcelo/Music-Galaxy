version: '3.8'

services:
  mariadb:
    image: mariadb:11.4
    container_name: musicgalaxy-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: musicgalaxy
      MARIADB_USER: musicgalaxy
      # Senhas vêm do ambiente (ou do .env ao lado deste arquivo).
      # Os valores padrão mantêm o comportamento anterior para uso local;
      # em qualquer ambiente compartilhado, defina MARIADB_PASSWORD e
      # MARIADB_ROOT_PASSWORD — nenhum segredo real fica versionado aqui.
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootsecret}
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musicgalaxy-network

  redis:
    image: redis:7-alpine
    container_name: musicgalaxy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musicgalaxy-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: musicgalaxy-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - musicgalaxy-network

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  mailpit_data:
    driver: local

networks:
  musicgalaxy-network:
    driver: bridge